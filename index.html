<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pursol</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #1ff042;
      font-family: "Courier New", monospace;
    }

    .terminal {
      padding: 40px;
      box-sizing: border-box;
    }

    .text {
      font-size: 16px;
      line-height: 1.6;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-shadow: 0 0 5px #1ff042;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #1ff042;
      vertical-align: middle;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="terminal">
    <div class="text">
      &gt; HELLO PURSOL<span class="cursor"></span>
    </div>
  </div>
</body>
</html>
